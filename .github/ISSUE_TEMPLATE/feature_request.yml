name: Feature request
description: Suggest an improvement to the app, command line, reports or docs.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. **Please do not paste secrets, tokens or private URLs** into this issue.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation first. The "problem" matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: dropdown
    id: who
    attributes:
      label: Who is it for?
      options:
        - Someone who is not comfortable with a terminal
        - A developer running scans by hand
        - CI / automated checks
        - People who publish or review MCP servers
        - Contributors (rules, tests, docs)
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you do today instead?
